[package]
name = "ai-protocol"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
# Virtual monotonic time for queue and retry deadline tests.
tokio = { version = "1.53.1", features = ["test-util"] }
