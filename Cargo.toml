[package]
name = "ai-protocol"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98.1"
description = "Cooperative agent access to HTTP services with shared workload budgets"
authors = ["Nikita Chindin"]
repository = "https://github.com/Xenox-developer/ai-protocol"
readme = "README.md"
keywords = ["agents", "http", "gateway", "scheduling"]
categories = ["web-programming::http-server", "asynchronous"]
include = ["/src/**", "/services/*.json", "/examples/native_service.rs", "/tests/library.rs", "/Cargo.lock", "/rust-toolchain.toml", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/CODE_OF_CONDUCT.md", "/docs/*.md", "/docs/assets/readme-cover-v2.png", "/python/ai_protocol/schemas/*.json"]

[dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
# Virtual monotonic time for queue and retry deadline tests.
tokio = { version = "1.53.1", features = ["test-util"] }
