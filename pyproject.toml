[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-protocol-client"
version = "0.1.0"
description = "Adaptive clients for cooperative agent access to HTTP services"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Nikita Chindin"}]
dependencies = ["httpx==0.28.1", "jsonschema==4.24.0"]

[project.optional-dependencies]
llm = ["openai==1.109.1"]
dev = ["build>=1.2"]

[project.urls]
Repository = "https://github.com/Xenox-developer/ai-protocol"
Issues = "https://github.com/Xenox-developer/ai-protocol/issues"

[tool.setuptools.packages.find]
where = ["python"]
